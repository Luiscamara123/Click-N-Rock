<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Rock - Minha Conta</title>
    <!-- Vinculação do arquivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>

<body id="meu-painel">

    <!-- NAV BAR SUPERIOR (INSPIRADA NA FOTO) -->
    <header class="top-navbar">
        <a href="#" class="brand-logo">
            <span>🤘</span> CLICK ROCK
        </a>

        <div class="search-bar">
            <input type="text" placeholder="Digite o produto...">
        </div>

        <ul class="nav-links">
            <li><a href="#">Início</a></li>
            <li><a href="#">Produtos</a></li>
            <li><a href="#">Ajuda</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="#" class="active-link">Meu painel</a></li>
        </ul>
    </header>

    <!-- FAIXA VERMELHA DE VANTAGENS (INSPIRADA NA FOTO) -->
    <section class="banner-benefits">
        <div class="benefit-item">
            <span class="benefit-icon">🚚</span>
            <div class="benefit-text">
                <div class="benefit-title">Envio para</div>
                <div class="benefit-subtitle">Todo o Brasil</div>
            </div>
        </div>

        <div class="benefit-item">
            <span class="benefit-icon">💳</span>
            <div class="benefit-text">
                <div class="benefit-title">Parcele em até</div>
                <div class="benefit-subtitle">12x sem juros</div>
            </div>
        </div>

        <div class="benefit-item">
            <span class="benefit-icon">⭐</span>
            <div class="benefit-text">
                <div class="benefit-title">Produtos</div>
                <div class="benefit-subtitle">De Qualidade</div>
            </div>
        </div>

        <div class="benefit-item">
            <span class="benefit-icon">👕</span>
            <div class="benefit-text">
                <div class="benefit-title">Designs Exclusivos</div>
                <div class="benefit-subtitle">Para Verdadeiros Fãs</div>
            </div>
        </div>
    </section>

    <!-- DASHBOARD DA CONTA -->
    <div class="dashboard" id="dashboard">

        <!-- SIDEBAR DE NAVEGAÇÃO INTERNA -->
        <aside class="sidebar">
            <nav class="menu">
                <button class="active" data-page="inicio">
                    🏠 &nbsp; Início
                </button>
                <button data-page="pedidos">
                    📦 &nbsp; Meus pedidos
                </button>
                <button data-page="perfil">
                    👤 &nbsp; Meu perfil
                </button>
                <button data-page="configuracoes">
                    ⚙️ &nbsp; Configurações
                </button>
            </nav>

            <button class="logout" id="logoutButton">
                🚪 &nbsp; Sair
            </button>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main">
            <header class="header">
                <div>
                    <h1 id="pageTitle"></h1>
                    <p id="pageDescription"></p>
                </div>

                <div class="user-area">
                    <div class="avatar" id="headerAvatar"></div>
                    <div>
                        <div class="user-name" id="headerUserName"></div>
                        <span class="user-type">Cliente Rock</span>
                    </div>
                </div>
            </header>

            <div id="pageContent"></div>
        </main>
    </div>

    <!-- TELA DE SAÍDA (LOGOUT) -->
    <div class="logout-screen" id="logoutScreen">
        <div class="logout-box">
            <div class="logout-icon">✓</div>
            <h2>Você saiu da conta</h2>
            <p>Sua sessão foi encerrada com sucesso.</p>
            <button class="return-button" id="returnButton">
                Voltar para minha conta
            </button>
        </div>
    </div>

    <!-- Vinculação do arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>

</html>
