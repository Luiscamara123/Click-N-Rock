<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Store - Minha Conta</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>

    <!-- PAINEL PRINCIPAL -->
    <div id="meu-painel">

        <!-- DASHBOARD -->
        <div class="dashboard" id="dashboard">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="logo">
                    <span>⚡</span> ROCK STORE
                </div>

                <nav class="menu">
                    <button class="active" data-page="inicio">
                        🏠 &nbsp; Início
                    </button>
                    <button data-page="pedidos">
                        📦 &nbsp; Meus pedidos
                    </button>
                    <button data-page="perfil">
                        👤 &nbsp; Meu perfil
                    </button>
                    <button data-page="configuracoes">
                        ⚙️ &nbsp; Configurações
                    </button>
                </nav>

                <button class="logout" id="logoutButton">
                    🚪 &nbsp; Sair
                </button>
            </aside>

            <!-- CONTEÚDO -->
            <main class="main">
                <header class="header">
                    <div>
                        <h1 id="pageTitle"></h1>
                        <p id="pageDescription"></p>
                    </div>

                    <div class="user-area">
                        <div class="avatar" id="headerAvatar"></div>
                        <div>
                            <div class="user-name" id="headerUserName"></div>
                            <span class="user-type">Cliente</span>
                        </div>
                    </div>
                </header>

                <div id="pageContent"></div>
            </main>
        </div>

        <!-- MODAL DE CONFIRMAÇÃO DE SAÍDA -->
        <div class="modal-overlay" id="logoutModal">
            <div class="modal-box">
                <h2>Confirmar Saída</h2>
                <p>Confirme seu e-mail e senha para encerrar a sessão.</p>

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="confirmEmail" placeholder="Digite seu e-mail">
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="confirmSenha" placeholder="Digite sua senha">
                </div>

                <div class="modal-error" id="modalError"></div>

                <div class="modal-actions">
                    <button class="cancel-button" id="cancelLogoutButton">Cancelar</button>
                    <button class="confirm-button" id="confirmLogoutButton">Sair da Conta</button>
                </div>
            </div>
        </div>

        <!-- TELA DEPOIS DE SAIR -->
        <div class="logout-screen" id="logoutScreen">
            <div class="logout-box">
                <div class="logout-icon">✓</div>
                <h2>Você saiu da conta</h2>
                <p>Sua sessão foi encerrada com sucesso.</p>
                <button class="return-button" id="returnButton">
                    Voltar para minha conta
                </button>
            </div>
        </div>

    </div>

    <script src="../../assets/js/script.js"></script>
</body>

</html>
